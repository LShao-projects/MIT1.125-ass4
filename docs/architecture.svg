<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1950" viewBox="0 0 1200 1950" role="img" aria-labelledby="title desc">
<title id="title">Suno in Practice pipeline architecture</title>
<desc id="desc">A centered vertical flow from run.sh through collection, extraction, storage, selection, drafting, review, packaging, and manual publication. Four evidence sources and two draft formats branch symmetrically around the center line.</desc>
